services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dmt_biometria
      POSTGRES_USER: dmt
      POSTGRES_PASSWORD: dmt_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmt -d dmt_biometria"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      LISTENER_API_KEY: ${LISTENER_API_KEY:-change-this-listener-key}
      DATABASE_URL: postgresql://dmt:dmt_dev_password@db:5432/dmt_biometria
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: dmt
      RABBITMQ_DEFAULT_PASS: dmt_dev_password
    restart: unless-stopped
  zkteco-listener:
    build: ./services/zkteco-listener
    environment:
      DMT_BACKEND_URL: http://backend:8000
      LISTENER_API_KEY: ${LISTENER_API_KEY:-change-this-listener-key}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: dmt
      RABBITMQ_PASSWORD: dmt_dev_password
      TZ: America/Guayaquil
    ports:
      - "8085:8082"
    depends_on:
      - rabbitmq
    restart: unless-stopped
  email-notifier:
    build: ./services/email-notifier
    environment:
      DB_URL: jdbc:postgresql://db:5432/dmt_biometria
      DB_USERNAME: dmt
      DB_PASSWORD: dmt_dev_password
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Institución Educativa}
      MAIL_TEST_RECIPIENTS: ${MAIL_TEST_RECIPIENTS:-}
      DMT_BACKEND_URL: http://backend:8000
      LISTENER_API_KEY: ${LISTENER_API_KEY:-change-this-listener-key}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: dmt
      RABBITMQ_PASSWORD: dmt_dev_password
      TZ: America/Guayaquil
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  frontend_node_modules:
